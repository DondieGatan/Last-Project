{% extends "base.html" %}
{% block title %}Forgot Password - Smart Resume Analyser{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="var(--primary)" viewBox="0 0 16 16">
                <path d="M11 1a2 2 0 0 0-2 2v4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1V3a4 4 0 0 1 7.874-1H11z"/>
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM5 9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V9z"/>
            </svg>
            <h2>Forgot Password?</h2>
            <p>Enter your email and we'll send you a 6-digit code</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
            <div class="auth-field">
                <label for="email">Email Address</label>
                <div class="auth-input-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="Enter your registered email" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block auth-btn">Send Reset Code</button>
        </form>

        <div class="auth-footer">
            Remember your password? <a href="{{ url_for('login') }}" class="auth-link">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
