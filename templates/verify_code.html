{% extends "base.html" %}
{% block title %}Verify Code - Smart Resume Analyser{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="var(--primary)" viewBox="0 0 16 16">
                <path d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233c.346.244.652.42.893.533.12.057.218.095.293.118a.55.55 0 0 0 .101.025.615.615 0 0 0 .1-.025c.076-.023.174-.061.294-.118.24-.113.547-.29.893-.533a10.726 10.726 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524zM5.072.56C6.157.265 7.31 0 8 0s1.843.265 2.928.56c1.11.3 2.229.655 2.887.87a1.54 1.54 0 0 1 1.044 1.262c.596 4.477-.787 7.795-2.465 9.99a11.775 11.775 0 0 1-2.517 2.453 7.159 7.159 0 0 1-1.048.625c-.28.132-.581.24-.829.24s-.548-.108-.829-.24a7.158 7.158 0 0 1-1.048-.625 11.777 11.777 0 0 1-2.517-2.453C1.928 10.487.545 7.169 1.141 2.692A1.54 1.54 0 0 1 2.185 1.43 62.456 62.456 0 0 1 5.072.56z"/>
                <path d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
            </svg>
            <h2>Enter Verification Code</h2>
            <p>We sent a 6-digit code to <strong>{{ email }}</strong></p>
        </div>

        <form method="POST" action="{{ url_for('verify_code') }}" class="auth-form">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="auth-field">
                <label for="code">6-Digit Code</label>
                <div class="code-inputs" id="code-inputs">
                    <input type="text" class="code-digit" maxlength="1" data-index="0" inputmode="numeric" autofocus>
                    <input type="text" class="code-digit" maxlength="1" data-index="1" inputmode="numeric">
                    <input type="text" class="code-digit" maxlength="1" data-index="2" inputmode="numeric">
                    <input type="text" class="code-digit" maxlength="1" data-index="3" inputmode="numeric">
                    <input type="text" class="code-digit" maxlength="1" data-index="4" inputmode="numeric">
                    <input type="text" class="code-digit" maxlength="1" data-index="5" inputmode="numeric">
                </div>
                <input type="hidden" id="code" name="code" value="">
            </div>

            <div class="code-timer">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-2px;margin-right:4px;">
                    <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
                </svg>
                Code expires in <span id="timer">10:00</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block auth-btn" id="verify-btn">Verify Code</button>
        </form>

        <div class="auth-footer">
            <span>Didn't receive the code? </span>
            <a href="{{ url_for('forgot_password') }}" class="auth-link">Resend Code</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var digits = document.querySelectorAll('.code-digit');
    var hidden = document.getElementById('code');

    function updateHidden() {
        var val = '';
        digits.forEach(function(d) { val += d.value; });
        hidden.value = val;
    }

    digits.forEach(function(input, i) {
        input.addEventListener('input', function(e) {
            var v = this.value.replace(/[^0-9]/g, '');
            this.value = v;
            updateHidden();
            if (v && i < 5) digits[i + 1].focus();
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && i > 0) {
                digits[i - 1].focus();
                digits[i - 1].value = '';
                updateHidden();
            }
        });

        input.addEventListener('paste', function(e) {
            e.preventDefault();
            var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
            for (var j = 0; j < 6 && j < paste.length; j++) {
                digits[j].value = paste[j];
            }
            updateHidden();
            var next = Math.min(paste.length, 5);
            digits[next].focus();
        });
    });

    // Countdown timer (10 minutes)
    var total = 600;
    var timerEl = document.getElementById('timer');
    var interval = setInterval(function() {
        total--;
        if (total <= 0) {
            clearInterval(interval);
            timerEl.textContent = 'Expired';
            timerEl.style.color = 'var(--danger)';
            document.getElementById('verify-btn').disabled = true;
            document.getElementById('verify-btn').textContent = 'Code Expired';
            return;
        }
        var m = Math.floor(total / 60);
        var s = total % 60;
        timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        if (total <= 60) timerEl.style.color = 'var(--danger)';
    }, 1000);
})();
</script>
{% endblock %}
