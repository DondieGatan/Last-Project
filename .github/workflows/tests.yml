name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CiPytestPassw0rd!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd="exit 0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SQL_SERVER: localhost
      SQL_DATABASE: smart_resume_analyser
      # Matches config.py's own default driver — installed below to match.
      SQL_TRUSTED_CONNECTION: "no"
      SQL_USERNAME: sa
      SQL_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'CiPytestPassw0rd!' }}
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Install ODBC Driver 17 for SQL Server
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for SQL Server to accept connections
        env:
          PYTHONWARNINGS: ignore
        run: |
          pip install pyodbc -q
          for i in $(seq 1 30); do
            python -c "
import pyodbc, sys, os
try:
    pyodbc.connect('DRIVER={ODBC Driver 17 for SQL Server};SERVER=localhost;UID=sa;PWD=' + os.environ['SQL_PASSWORD'] + ';TrustServerCertificate=yes;', timeout=3)
    sys.exit(0)
except Exception as e:
    print(e); sys.exit(1)
" && break
            sleep 2
          done

      - name: Create schema (resumes/skills/education/experience/analysis_results)
        run: python scripts/run_sql_file.py setup_db.sql

      - name: Create users table
        run: python -c "from models import init_users_table; init_users_table()"

      - name: Run schema migrations (adds resumes.user_id, recreates the dashboard view)
        run: python -c "from models import ensure_schema_migrations; ensure_schema_migrations()"

      - name: Run tests
        run: pytest -v
